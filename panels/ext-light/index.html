<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EXT LT</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="panel">
      <h1>EXT LT</h1>
      <p class="subtitle">iniBuilds A320neo v2 · <code>L:INI_WING_LIGHT_SWITCH</code></p>
      <p class="status status--waiting" data-sc-status>Connecting…</p>

      <label class="toggle">
        <input
          type="checkbox"
          data-sc-widget="wingLight"
          data-sc-on="ON"
          data-sc-off="OFF"
          disabled
        />
        <span class="toggle__track" aria-hidden="true">
          <span class="toggle__thumb"></span>
        </span>
        <span class="toggle__text">OFF</span>
      </label>
    </main>
    <script src="/__simconnections/client.js"></script>
  </body>
</html>
