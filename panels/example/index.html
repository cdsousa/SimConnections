<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example panel</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="panel">
      <h1>Example panel</h1>
      <p class="subtitle">Custom folder via <code>--panel</code></p>
      <p class="status status--waiting" data-sc-status>Connecting…</p>

      <label class="toggle">
        <input type="checkbox" data-sc-widget="parkingBrake" disabled />
        <span class="toggle__track" aria-hidden="true">
          <span class="toggle__thumb"></span>
        </span>
        <span class="toggle__text">Released</span>
      </label>
    </main>
    <script src="/__simconnections/client.js"></script>
  </body>
</html>
